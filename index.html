<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fractal Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="shell">
        <header class="titlebar">
            <h1>Fractal Viewer</h1>
            <p id="view-title" class="view-title">Mandelbrot Set</p>
        </header>

        <aside class="sidebar">
            <p class="sidebar-label" id="selector-label">Fractal</p>
            <div class="selector" role="radiogroup" aria-labelledby="selector-label">
                <button type="button" class="choice" role="radio" id="choice-mandelbrot" data-view="mandelbrot" aria-checked="true">
                    <span class="choice-name">Mandelbrot Set</span>
                    <span class="choice-meta">2D escape-time</span>
                </button>
                <button type="button" class="choice" role="radio" id="choice-mandelbulb" data-view="mandelbulb" aria-checked="false">
                    <span class="choice-name">Mandelbulb</span>
                    <span class="choice-meta">3D extension</span>
                </button>
            </div>
        </aside>

        <main class="stage">
            <iframe id="viewport" title="Mandelbrot Set" src="fractal.html"></iframe>
        </main>

        <footer class="titlebar statusbar">
            <p id="view-blurb">2D escape-time fractal</p>
            <p id="view-hint">Drag to pan · scroll to zoom</p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
